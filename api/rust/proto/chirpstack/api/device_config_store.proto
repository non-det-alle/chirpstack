syntax = "proto3";

package api;

option go_package = "github.com/chirpstack/chirpstack/api/go/v4/api";
option java_package = "io.chirpstack.api";
option java_multiple_files = true;
option java_outer_classname = "DeviceConfigStoreProto";
option csharp_namespace = "Chirpstack.Api";
option php_namespace = "Chirpstack\\Api";
option php_metadata_namespace = "GPBMetadata\\Chirpstack\\Api";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// DeviceConfigStoreService is the service providing API methods for managing
// the configuration of radio parameters of devices.
service DeviceConfigStoreService {
    // Set configuration store for the device (i.e., Upsert).
    rpc Set(SetDeviceConfigStoreRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            put : "/api/device_config_stores/{dev_eui}"
            body : "*"
        };
    }

    // Get returns the configuration store for the given DevEUI.
    rpc Get(GetDeviceConfigStoreRequest)
        returns (GetDeviceConfigStoreResponse) {
        option (google.api.http) = {
            get : "/api/device_config_stores/{dev_eui}"
        };
    }

    // Delete removes the configuration store for the device.
    // Note: Configurations fall back to the regional default / ADR.
    rpc Delete(DeleteDeviceConfigStoreRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            delete : "/api/device_config_stores/{dev_eui}"
        };
    }

    // List DevEUIs of devices having configuration store.
    rpc List(ListDeviceConfigStoresRequest)
        returns (ListDeviceConfigStoresResponse) {
        option (google.api.http) = {
            get : "/api/device_config_stores"
        };
    }

    // Returns the device's alignment status for stored configurations
    // (whether they have been sent to and acknowledged by the device).
    rpc GetDeviceConfigAlignment(GetDeviceConfigAlignmentRequest)
        returns (GetDeviceConfigAlignmentResponse) {
        option (google.api.http) = {
            get : "/api/device_config_stores/{dev_eui}/alignment"
        };
    }

    // Get the MAC layer transmission parameters currently in use by the given device as far
    // as the server knows, based on most recent transmissions and MAC command acknowledgments.
    // Note: Params may not yet be aligned with the ones set in the device's config store.
    rpc GetDeviceCurrentParams(GetDeviceCurrentParamsRequest)
        returns (GetDeviceCurrentParamsResponse) {
        option (google.api.http) = {
            get : "/api/device_config_stores/{dev_eui}/device_current_config"
        };
    }
}

message DeviceConfigStore {
    // Enabled uplink channel indices in the channel mask.
    // (missing channels are disabled)
    repeated uint32 enabled_uplink_channel_indices = 1;

    // Data-rate.
    optional uint32 dr = 2;

    // Transmission power index.
    optional uint32 tx_power_index = 3;

    // Number of transmissions.
    optional uint32 nb_trans = 4;

    // Maximum duty-cycle.
    optional uint32 max_duty_cycle = 5;
}

message DeviceConfigStoreListItem {
    // Device EUI (EUI64).
    string dev_eui = 1;

    // Created at timestamp.
    google.protobuf.Timestamp created_at = 2;

    // Last update timestamp.
    google.protobuf.Timestamp updated_at = 3;
}

message DeviceUplinkChannel {
    // Frequency Hz.
    uint32 frequency = 1;

    // Available data-rates.
    repeated uint32 data_rates = 2;

    // Whether this channel is enabled on the device.
    bool enabled = 4;

    // Whether this channel is not among regional defaults.
    bool user_defined = 5;
}

message SetDeviceConfigStoreRequest {
    // Device EUI (EUI64).
    string dev_eui = 1;

    // Object to set.
    DeviceConfigStore device_config_store = 2;
}

message GetDeviceConfigStoreRequest {
    // Device EUI (EUI64).
    string dev_eui = 1;
}

message GetDeviceConfigStoreResponse {
    // Device configuration store object.
    DeviceConfigStore device_config_store = 1;

    // Created at timestamp.
    google.protobuf.Timestamp created_at = 2;

    // Last update timestamp.
    google.protobuf.Timestamp updated_at = 3;
}

message DeleteDeviceConfigStoreRequest {
    // Device EUI (EUI64).
    string dev_eui = 1;
}

message ListDeviceConfigStoresRequest {
    // Max number of chmasks to return in the result-set.
    // If not set, it will be treated as 0, and the response will only return the total_count.
    uint32 limit = 1;

    // Offset in the result-set (for pagination).
    uint32 offset = 2;

    // Application ID (UUID) to filter devices on.
    string application_id = 3;
}

message ListDeviceConfigStoresResponse {
    // Total number of configuration stores.
    uint32 total_count = 1;

    // Result-set.
    repeated DeviceConfigStoreListItem result = 2;
}

message GetDeviceConfigAlignmentRequest {
    // Device EUI (EUI64).
    string dev_eui = 1;
}

message GetDeviceConfigAlignmentResponse {
    // Alignment of the mask of enabled uplink channels.
    optional bool enabled_uplink_channel_indices = 1;

    // Alignment of the data-rate.
    optional bool dr = 2;

    // Alignment of the transmission power index.
    optional bool tx_power_index = 3;

    // Alignment of the number of transmissions.
    optional bool nb_trans = 4;

    // Alignment of the maximum duty-cycle.
    optional bool max_duty_cycle = 5;
}

message GetDeviceCurrentParamsRequest {
    // Device EUI (EUI64).
    string dev_eui = 1;
}

message GetDeviceCurrentParamsResponse {
    // Uplink channels currently available to the device.
    map<uint32, DeviceUplinkChannel> channels = 1;

    // Data-rate.
    uint32 dr = 2;

    // Transmission power index.
    uint32 tx_power_index = 3;

    // Number of transmissions.
    uint32 nb_trans = 4;

    // Maximum duty-cycle.
    uint32 max_duty_cycle = 5;
}
